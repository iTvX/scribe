# 合成的测试样本：只保留方案的骨架。
schema:
  schema_id: rime_ice
  name: 雾凇拼音（测试）
  version: "0.1"

engine:
  processors:
    - lua_processor@*cold_word_drop.processor
    - ascii_composer
    - speller
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - abc_segmentor
    - fallback_segmentor
  translators:
    - script_translator
    - lua_translator@*date_translator

translator:
  dictionary: rime_ice
