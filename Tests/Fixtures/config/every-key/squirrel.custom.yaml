# Every key Scribe reads from squirrel.yaml, set to a value that differs from
# Scribe's defaults, on top of SharedSupport/squirrel.yaml. The preset sets
# each scheme-level key to a value that also differs from the global style,
# except booleans and the two-valued layout and orientation, which have no
# third value.
patch:
  keyboard_layout: USExtended
  chord_duration: 0.25
  show_notifications_when: never
  status_icon/show: false
  unsafe/report_bundleid: true
  app_options/com.apple.Terminal/ascii_mode: false
  style/+:
    color_scheme: every_key
    color_scheme_dark: solarized_dark
    candidate_list_layout: linear
    text_orientation: vertical
    inline_preedit: true
    inline_candidate: true
    translucency: true
    mutual_exclusive: true
    memorize_size: false
    show_paging: true
    status_message_type: long
    candidate_format: "%c %@"
    alpha: 0.9
    corner_radius: 3
    hilited_corner_radius: 2
    surrounding_extra_expansion: 1
    border_height: 4
    border_width: 5
    line_spacing: 6
    spacing: 7
    base_offset: 1
    shadow_size: 2
    font_face: Avenir Next
    font_point: 15
    label_font_face: Menlo
    label_font_point: 11
    comment_font_face: Courier
    comment_font_point: 13
    preedit_font_face: Georgia
    preedit_font_point: 14
  preset_color_schemes/+:
    every_key:
      name: Every key
      author: Scribe tests
      color_space: display_p3
      back_color: 0xF0102030
      border_color: 0xE0112233
      preedit_back_color: 0xD0122334
      candidate_back_color: 0xC0132435
      hilited_back_color: 0xB0142536
      hilited_candidate_back_color: 0xA0152637
      text_color: 0x90162738
      hilited_text_color: 0x80172839
      candidate_text_color: 0x7018293A
      hilited_candidate_text_color: 0x60192A3B
      label_color: 0x501A2B3C
      hilited_candidate_label_color: 0x401B2C3D
      comment_text_color: 0x301C2D3E
      hilited_comment_text_color: 0x201D2E3F
      accent_text_color: 0x101E2F40
      warning_text_color: 0xFF1F3041
      candidate_list_layout: linear
      text_orientation: vertical
      inline_preedit: true
      inline_candidate: true
      translucency: true
      mutual_exclusive: true
      show_paging: true
      candidate_format: "[label]: [candidate]"
      alpha: 0.8
      corner_radius: 4
      hilited_corner_radius: 3
      surrounding_extra_expansion: 2
      border_height: 5
      border_width: 6
      line_spacing: 7
      spacing: 8
      base_offset: 2
      shadow_size: 3
      font_face: PingFangSC-Regular
      font_point: 17
      label_font_face: Monaco
      label_font_point: 12
      comment_font_face: Georgia
      comment_font_point: 14
      preedit_font_face: Optima
      preedit_font_point: 16
