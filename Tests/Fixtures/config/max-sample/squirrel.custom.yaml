# A Max-style patch for the deploy tests, with the same values as
# Packages/ScribeConfig/Tests/ScribeConfigTests/Support/MaxSample.swift.
# candidate_format has plain ASCII spaces, as in Max's own file (whose
# comment says U+2005); LibrimeConfigTests covers a literal U+2005.
patch:
  preset_color_schemes/+:
    wechat_light:
      name: 微信／WeChat Light
      candidate_list_layout: linear
      border_width: 8
      border_height: 0
      corner_radius: 5
      font_face: PingFangSC-Regular
      font_point: 16
      label_font_point: 12
      inline_preedit: true
      candidate_format: "%c %@ "
      back_color: 0xFFFFFF
      text_color: 0x424242
      hilited_candidate_back_color: 0x75B100
      hilited_candidate_text_color: 0xFFFFFF
      comment_text_color: 0x999999
    wechat_dark:
      name: 微信／WeChat Dark
      candidate_list_layout: linear
      border_width: 8
      border_height: 0
      corner_radius: 5
      font_face: PingFangSC-Regular
      font_point: 16
      label_font_point: 12
      inline_preedit: true
      candidate_format: "%c %@ "
      back_color: 0x2D2D2D
      text_color: 0xBDBDBD
      candidate_text_color: 0xE0E0E0
      label_color: 0x8C8C8C
      hilited_candidate_back_color: 0x75B100
      hilited_candidate_text_color: 0xFFFFFF
      comment_text_color: 0x8C8C8C
  style/color_scheme: wechat_light
  style/color_scheme_dark: wechat_dark
  app_options/com.googlecode.iterm2/ascii_mode: false
