# XcodeGen project description. Generate Scribe.xcodeproj with `xcodegen generate`;
# the generated project is not checked in.
name: Scribe

options:
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: en
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_HARDENED_RUNTIME: YES
    DEAD_CODE_STRIPPING: YES
    # Local builds are signed ad hoc; release builds override the identity.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""

packages:
  RimeKit:
    path: Packages/RimeKit
  ScribeConfig:
    path: Packages/ScribeConfig
  ScribeCore:
    path: Packages/ScribeCore
  ScribeUI:
    path: Packages/ScribeUI

targets:
  Scribe:
    type: application
    platform: macOS
    sources:
      - path: App/Sources
      - path: App/Resources
    dependencies:
      - package: RimeKit
      - package: ScribeConfig
      - package: ScribeCore
      - package: ScribeUI
      - sdk: Carbon.framework
      - sdk: InputMethodKit.framework
    settings:
      base:
        PRODUCT_NAME: Scribe
        PRODUCT_BUNDLE_IDENTIFIER: io.github.itvx.inputmethod.Scribe
        INFOPLIST_FILE: App/Info.plist
        # Ad hoc signatures carry no Team ID, so with the hardened runtime on,
        # library validation would refuse to load librime.1.dylib.
        CODE_SIGN_ENTITLEMENTS: App/Scribe.entitlements
        GENERATE_INFOPLIST_FILE: NO
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
        COMBINE_HIDPI_IMAGES: YES
        # A plain executable; the debug dylib only serves SwiftUI previews.
        ENABLE_DEBUG_DYLIB: NO

  # Tests for the IMK adapter. The adapter sources are compiled into the
  # bundle directly, so it needs no host app.
  ScribeTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: App/Sources/Adapter
      - path: App/Tests
    dependencies:
      - package: ScribeCore
        product: ScribeCore
      - package: ScribeCore
        product: ScribeTestSupport
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.itvx.inputmethod.ScribeTests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Scribe:
    build:
      targets:
        Scribe: all
        ScribeTests: [test]
    test:
      targets:
        - ScribeTests
    run:
      config: Debug
    archive:
      config: Release
