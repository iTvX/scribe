# XcodeGen project description. Generate Scribe.xcodeproj with `xcodegen generate`;
# the generated project is not checked in.
name: Scribe

options:
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: en
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: 0.1.1
    CURRENT_PROJECT_VERSION: 1
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_HARDENED_RUNTIME: YES
    DEAD_CODE_STRIPPING: YES
    # Local builds are signed ad hoc; release builds override the identity.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""

packages:
  RimeKit:
    path: Packages/RimeKit
  ScribeConfig:
    path: Packages/ScribeConfig
  ScribeCore:
    path: Packages/ScribeCore
  ScribeUI:
    path: Packages/ScribeUI

targets:
  Scribe:
    type: application
    platform: macOS
    sources:
      - path: App/Sources
      - path: App/Resources
      # Fetched by Scripts/fetch-librime.sh. librime loads its plugins from the
      # rime-plugins directory next to librime.1.dylib.
      - path: Frameworks/rime-plugins
        buildPhase:
          copyFiles:
            destination: frameworks
            subpath: rime-plugins
        attributes: [CodeSignOnCopy]
      - path: Frameworks/opencc
        type: folder
        buildPhase:
          copyFiles:
            destination: sharedSupport
      - path: Frameworks/rime-data
        buildPhase:
          copyFiles:
            destination: sharedSupport
      # Squirrel's frontend settings, deployed with config_version like
      # Squirrel does.
      - path: SharedSupport/squirrel.yaml
        buildPhase:
          copyFiles:
            destination: sharedSupport
      # Scribe's own settings, deployed the same way.
      - path: SharedSupport/scribe.yaml
        buildPhase:
          copyFiles:
            destination: sharedSupport
      # rime_deployer, rime_dict_manager and rime-install, next to Scribe as
      # in Squirrel; signed by the script below.
      - path: Frameworks/bin
        buildPhase:
          copyFiles:
            destination: executables
    dependencies:
      - package: RimeKit
      - package: ScribeConfig
      - package: ScribeCore
      - package: ScribeUI
      - sdk: Carbon.framework
      - sdk: InputMethodKit.framework
      # Fetched by Scripts/fetch-sparkle.sh, for software updates. Release
      # builds re-sign it with the app's identity.
      - framework: Frameworks/Sparkle.framework
        embed: true
        codeSign: true
      # Scribe Settings ships inside Scribe.app, in Contents/Helpers, so there
      # is one thing to install; the script below takes its copy of librime
      # out, as it loads Scribe.app's, and signs it.
      - target: ScribeSettings
        embed: true
        codeSign: false
        copy:
          destination: wrapper
          subpath: Contents/Helpers
    postBuildScripts:
      - name: Embed Scribe Settings
        basedOnDependencyAnalysis: false
        script: |
          helper="${TARGET_BUILD_DIR}/${WRAPPER_NAME}/Contents/Helpers/ScribeSettings.app"
          # librime comes from Scribe.app/Contents/Frameworks instead; see the
          # ScribeSettings target's runpath search paths.
          rm -f "${helper}/Contents/Frameworks/librime.1.dylib"
          rmdir "${helper}/Contents/Frameworks" 2>/dev/null || true
          if [ "${CODE_SIGNING_ALLOWED}" != "YES" ]; then
            exit 0
          fi
          identity="${EXPANDED_CODE_SIGN_IDENTITY:--}"
          codesign --force --sign "${identity}" --options runtime \
            --entitlements "${SRCROOT}/Settings/ScribeSettings.entitlements" "${helper}"
      - name: Sign the command line tools
        basedOnDependencyAnalysis: false
        script: |
          # Xcode signs the app last, and everything in Contents/MacOS needs a
          # signature by then. The tools get the app's entitlements, so that
          # with an ad hoc signature they can still load librime.
          if [ "${CODE_SIGNING_ALLOWED}" != "YES" ]; then
            exit 0
          fi
          tools="${TARGET_BUILD_DIR}/${EXECUTABLE_FOLDER_PATH}"
          identity="${EXPANDED_CODE_SIGN_IDENTITY:--}"
          for tool in rime_deployer rime_dict_manager; do
            codesign --force --sign "${identity}" --options runtime \
              --entitlements "${SRCROOT}/App/Scribe.entitlements" "${tools}/${tool}"
          done
          codesign --force --sign "${identity}" --options runtime "${tools}/rime-install"
    settings:
      base:
        PRODUCT_NAME: Scribe
        PRODUCT_BUNDLE_IDENTIFIER: io.github.itvx.inputmethod.Scribe
        INFOPLIST_FILE: App/Info.plist
        # Ad hoc signatures carry no Team ID, so with the hardened runtime on,
        # library validation would refuse to load librime.1.dylib.
        CODE_SIGN_ENTITLEMENTS: App/Scribe.entitlements
        GENERATE_INFOPLIST_FILE: NO
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
        COMBINE_HIDPI_IMAGES: YES
        # A plain executable; the debug dylib only serves SwiftUI previews.
        ENABLE_DEBUG_DYLIB: NO

  # Tests for the IMK adapter. The adapter sources are compiled into the
  # bundle directly, so it needs no host app.
  ScribeTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: App/Sources/Adapter
      - path: App/Sources/Command.swift
      - path: App/Sources/DeployMessage.swift
      - path: App/Sources/DistributionIdentity.swift
      - path: App/Sources/FrontendConfig.swift
      - path: App/Sources/InputSourceInstaller.swift
      - path: App/Sources/InputMenu.swift
      - path: App/Sources/LaunchGuard.swift
      - path: App/Sources/MaintenanceQueue.swift
      - path: App/Sources/Log.swift
      - path: App/Sources/UpdateConfiguration.swift
      - path: App/Tests
    dependencies:
      - package: ScribeCore
        product: ScribeCore
      - package: ScribeCore
        product: ScribeTestSupport
      - package: RimeKit
      - package: ScribeUI
      - package: ScribeConfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.itvx.inputmethod.ScribeTests
        GENERATE_INFOPLIST_FILE: YES

  ScribeSettings:
    type: application
    platform: macOS
    sources:
      - path: Settings/Sources
      - path: Settings/Resources
    dependencies:
      - package: ScribeConfig
      - package: ScribeCore
      - package: RimeKit
    settings:
      base:
        PRODUCT_NAME: ScribeSettings
        # Keeps the module name apart from ScribeConfig's ScribeSettings type.
        PRODUCT_MODULE_NAME: SettingsApp
        PRODUCT_BUNDLE_IDENTIFIER: io.github.itvx.inputmethod.Scribe.Settings
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        # ScribeConfig links librime through RimeKit; see the Scribe target.
        CODE_SIGN_ENTITLEMENTS: Settings/ScribeSettings.entitlements
        # Its own Frameworks when built on its own; Scribe.app's when it ships
        # inside it, in Contents/Helpers.
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks @executable_path/../../../../Frameworks"

schemes:
  Scribe:
    build:
      targets:
        Scribe: all
        ScribeTests: [test]
    test:
      targets:
        - ScribeTests
    run:
      config: Debug
    archive:
      config: Release
  ScribeSettings:
    build:
      targets:
        ScribeSettings: all
    run:
      config: Debug
