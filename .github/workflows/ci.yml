name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The feed release builds check; see release.yml.
  SPARKLE_FEED_URL: https://github.com/iTvX/scribe/releases/download/appcast/appcast.xml
  # The Xcode CI builds with, the one release builds use on the Mac mini.
  XCODE_VERSION: "27.1"

jobs:
  # Picks the runner and whether anything but documentation changed. Max's
  # own pushes and pull requests from branches of this repository run on his
  # Mac mini when the CI_RUNNER variable is "self-hosted"; everything else,
  # fork pull requests included, runs on GitHub's Macs. The runner checks the
  # same again before every job (docs/development.md, "自托管 runner").
  route:
    name: Route
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      runner: ${{ steps.runner.outputs.runner }}
      code: ${{ steps.changes.outputs.code }}
    steps:
      - name: Pick the runner
        id: runner
        env:
          CI_RUNNER: ${{ vars.CI_RUNNER }}
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          EVENT: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
        run: |
          own=false
          if [[ "${ACTOR}" == "iTvX" && "${TRIGGERING_ACTOR}" == "iTvX" ]]; then
            if [[ "${EVENT}" == "push" || ( "${EVENT}" == "pull_request" && "${HEAD_REPO}" == "${REPO}" ) ]]; then
              own=true
            fi
          fi
          if [[ "${CI_RUNNER}" == "self-hosted" && "${own}" == "true" ]]; then
            echo 'runner=["self-hosted","macOS","ARM64","scribe-mac"]' >> "${GITHUB_OUTPUT}"
            echo "Max's Mac mini"
          else
            echo 'runner="xcode-27"' >> "${GITHUB_OUTPUT}"
            echo "GitHub's Macs"
          fi

      - name: Look for changes beyond documentation
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          if [[ "${EVENT}" == "pull_request" ]]; then
            files="$(gh api "repos/${REPO}/pulls/${PR}/files" --paginate --jq '.[].filename')"
          elif [[ -n "${BEFORE}" && "${BEFORE}" != 0000000000000000000000000000000000000000 ]]; then
            files="$(gh api "repos/${REPO}/compare/${BEFORE}...${SHA}" --jq '.files[].filename')" || files=""
          else
            files=""
          fi
          echo "${files}"
          code=true
          if [[ -n "${files}" ]] && ! grep -qvE '^docs/|\.md$' <<< "${files}"; then
            code=false
          fi
          echo "code=${code}" >> "${GITHUB_OUTPUT}"
          echo "code changed: ${code}"

  packages:
    name: Test packages
    needs: route
    if: needs.route.outputs.code == 'true'
    runs-on: ${{ fromJSON(needs.route.outputs.runner) }}
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare
        uses: ./.github/actions/prepare

      - name: Check that only RimeKit imports librime
        run: |
          if grep -rnE '^[[:space:]]*(@[A-Za-z_]+[[:space:]]+)*((public|package|internal|fileprivate|private)[[:space:]]+)?import[[:space:]]+librime([[:space:]]|$)' \
              --include='*.swift' App Packages | grep -v '^Packages/RimeKit/'; then
            echo "::error::Only RimeKit may import librime"
            exit 1
          fi

      - name: Test packages
        run: |
          for package in Packages/*/; do
            echo "::group::swift test ${package}"
            swift test --package-path "${package}" -Xswiftc -warnings-as-errors
            echo "::endgroup::"
          done

      - name: Test release tooling
        run: swift test --package-path Tools/scribe-release -Xswiftc -warnings-as-errors

      # Expected, actual and diff images of candidate window snapshots that
      # did not match, and renders of snapshots with no baseline yet.
      - name: Upload snapshot failures
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: snapshot-failures
          path: build/snapshot-failures
          if-no-files-found: ignore
          retention-days: 14

  app:
    name: Build and test the app
    needs: route
    if: needs.route.outputs.code == 'true'
    runs-on: ${{ fromJSON(needs.route.outputs.runner) }}
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare
        uses: ./.github/actions/prepare

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build app
        run: |
          xcodebuild \
            -project Scribe.xcodeproj \
            -scheme Scribe \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            -destination "generic/platform=macOS" \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES \
            build

      - name: Build settings app
        run: |
          xcodebuild \
            -project Scribe.xcodeproj \
            -scheme ScribeSettings \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            -destination "generic/platform=macOS" \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES \
            build

      # 雾凇拼音 at its pinned release, in a temporary directory.
      - name: Play the gate replays
        run: Scripts/check-gate.sh

      - name: Test app
        run: |
          xcodebuild \
            -project Scribe.xcodeproj \
            -scheme Scribe \
            -derivedDataPath build/DerivedData \
            -destination "platform=macOS" \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES \
            test

      - name: Forget the built apps
        if: always() && runner.environment == 'self-hosted'
        run: Scripts/ci-forget-built-apps.sh

  package:
    name: Package
    needs: route
    if: needs.route.outputs.code == 'true'
    runs-on: ${{ fromJSON(needs.route.outputs.runner) }}
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare
        uses: ./.github/actions/prepare

      - name: Generate Xcode project
        run: xcodegen generate

      # The package below trusts this key, which signs the dry-run appcast. CI
      # never has the real update signing key, which stays in the release
      # keychain.
      - name: Make a throwaway update key
        id: throwaway
        run: |
          umask 077
          Scripts/release-tool.sh key new > "${RUNNER_TEMP}/scribe-throwaway-key"
          echo "public_key=$(Scripts/release-tool.sh key public < "${RUNNER_TEMP}/scribe-throwaway-key")" >> "${GITHUB_OUTPUT}"

      # Checks the release packaging without credentials: an ad hoc signed app
      # in an unsigned package. Signing and notarization run in release.yml.
      - name: Build unsigned package
        id: package
        env:
          SPARKLE_PUBLIC_KEY: ${{ steps.throwaway.outputs.public_key }}
        run: Scripts/build-release.sh --unsigned

      - name: Verify unsigned package
        env:
          PACKAGE: ${{ steps.package.outputs.package }}
        run: Scripts/check-release.sh --unsigned --expect-feed "${SPARKLE_FEED_URL}" "${PACKAGE}"

      # Extends Tests/Fixtures/appcast/published.xml, a feed signed with
      # sign_update and a throwaway key (see the comment in it), with this
      # package, then signs and checks the result as a release does.
      - name: Dry-run the appcast
        env:
          PACKAGE: ${{ steps.package.outputs.package }}
          APPCAST_EXISTING: Tests/Fixtures/appcast/published.xml
        run: |
          SPARKLE_KEY_FILE="${RUNNER_TEMP}/scribe-throwaway-key" \
            Scripts/make-appcast.sh "${PACKAGE}" build/release/publish

      - name: Remove the throwaway key
        if: always()
        run: rm -f "${RUNNER_TEMP}/scribe-throwaway-key"

      - name: Forget the built apps
        if: always() && runner.environment == 'self-hosted'
        run: Scripts/ci-forget-built-apps.sh
